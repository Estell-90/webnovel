<body class="app-body">
  <div class="app-content">
  <header class="app-brand">

      <span class="app-brand-heart" aria-hidden="true">♥</span>

  <nav class="nav" aria-label="메인 탭">

  <div class="page" id="view-today">
    <div class="today-head">

    <!-- 오늘의 (매일) : 날짜_1, 날짜_2 → 월요일에는 숨김 -->
    <section class="block" id="block-daily" data-type="daily">
      <div class="card-news card-news--today">
        <div class="card-pair card-pair--daily">
          <div class="card-img-wrap">
            <img class="card-img" id="daily-1" alt="오늘의 추천 1" />
          </div>
          <div class="card-img-wrap">
            <img class="card-img" id="daily-2" alt="오늘의 추천 2" />
          </div>
        </div>
      </div>
    </section>

    <!-- 이번 주 추천 (위클리) : [W]날짜 → 월요일만 표시 -->
    <section class="block hidden" id="block-weekly" data-type="weekly">
      <div class="card-news card-news--week">
        <div class="card-img-wrap card-img-wrap--single">
          <img class="card-img" id="weekly-img" alt="이번 주 추천" />
        </div>
      </div>
    </section>

    <!-- 이번 달 추천 (먼슬리) : [M]날짜 → 그달 마지막 날만 표시 -->
    <section class="block hidden" id="block-monthly" data-type="monthly">
      <div class="card-news card-news--month">
        <div class="card-img-wrap card-img-wrap--single">
          <img class="card-img" id="monthly-img" alt="이번 달 추천" />
        </div>
      </div>
    </section>
  </div>

  <div class="page page--archive hidden" id="view-archive">
    <header class="archive-head">
      <h2 class="archive-head-title">아카이브</h2>
      <p class="page-desc">키워드로 검색하거나 목록에서 날짜를 골라 과거 추천을 볼 수 있어요.</p>
    </header>
    <div class="archive-toolbar">
      <input type="search" class="archive-search" id="archive-search" placeholder="제목, 플랫폼, 장르, 키워드 검색…" autocomplete="off" />
      <select class="archive-type" id="archive-type" aria-label="유형 필터">
        <option value="">전체</option>
        <option value="daily">매일</option>
        <option value="weekly">이번 주</option>
        <option value="monthly">이번 달</option>
      </select>
    </div>
    <div class="archive-list" id="archive-list"></div>
    <p class="archive-empty hidden" id="archive-empty">검색 결과가 없어요. 다른 키워드로 시도해 보세요.</p>
  </div>

  <div class="archive-viewer hidden" id="archive-viewer">
    <button type="button" class="archive-back" id="archive-back">← 목록으로</button>

  <script>
    var IMAGE_BASE_LOCAL = "./cards/";
    var IMAGE_BASE_UPLOADS = "./uploads/";
    /* Drive <img> 링크는 구글에서 자주 막힙니다. 로컬 파일을 쓰면 가장 확실합니다. */
    var TRY_LOCAL_IMAGES_FIRST = true;
    /* Drive URL 을 아예 쓰지 않으려면 false (drive-manifest 무시, cards/uploads 만) */
    var USE_DRIVE_IN_MANIFEST = true;
    var todayViewOffsetDays = 0;
    var cardImageMap = {};
    var PIXEL_GIF =
      "data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7";

    function manifestIdOrUrlForFile(filename) {
      if (!USE_DRIVE_IN_MANIFEST) return null;
      if (!filename) return null;
      if (cardImageMap[filename]) return String(cardImageMap[filename]).trim();
      var low = filename.toLowerCase();
      var k;
      for (k in cardImageMap) {
        if (
          Object.prototype.hasOwnProperty.call(cardImageMap, k) &&
          k.toLowerCase() === low
        ) {
          return String(cardImageMap[k]).trim();
        }
      }
      return null;
    }

    function driveImageUrlCandidates(fileId) {
      var id = String(fileId).trim();
      var enc = encodeURIComponent(id);
      return [
        "https://lh3.googleusercontent.com/d/" + id,
        "https://drive.google.com/thumbnail?id=" + enc + "&sz=w2000",
        "https://drive.google.com/uc?export=view&id=" + enc,
        "https://drive.usercontent.google.com/uc?id=" + enc + "&export=view"
      ];
    }

    function localImagePaths(filename) {
      return [IMAGE_BASE_LOCAL + filename, IMAGE_BASE_UPLOADS + filename];
    }

    function bindCardImage(el, filename, opts) {
      if (!el) return;
      opts = opts || {};
      el.referrerPolicy = "no-referrer";
      el.loading = opts.eager ? "eager" : "lazy";
      var raw = manifestIdOrUrlForFile(filename);
      var remote = [];
      if (raw && /^https?:\/\//i.test(raw)) {
        remote.push(raw);
      } else if (raw) {
        remote = driveImageUrlCandidates(raw);
      }
      var local = localImagePaths(filename);
      var chain = TRY_LOCAL_IMAGES_FIRST ? local.concat(remote) : remote.concat(local);

      var i = 0;
      el.onerror = function () {
        i++;
        if (i < chain.length) {
          this.src = chain[i];
        } else {
          this.style.display = "none";
        }
      };
      el.src = chain[0];
    }

    function mergeDriveFileMap(map) {
      if (!map || typeof map !== "object") return;
      var k;
      for (k in map) {
        if (Object.prototype.hasOwnProperty.call(map, k) && map[k]) {
          cardImageMap[k] = map[k];
        }
      }
    }

    function loadCardImageIndex() {
      return fetch("./drive-manifest.json")
        .then(function (res) {
          return res.ok ? res.json() : Promise.reject(new Error("HTTP " + res.status));
        })
        .then(function (data) {
          if (data && typeof data === "object") mergeDriveFileMap(data);
          var n = Object.keys(cardImageMap).length;
          if (n === 0) {
            console.warn(
              "[webnovel] drive-manifest.json 이 비어 있거나 없습니다. " +
                "update_drive_manifest.py 를 실행했는지 확인하세요."
            );
          }
        })
        .catch(function (err) {
          console.warn(
            "[webnovel] drive-manifest.json 을 불러오지 못했습니다.",
            err && err.message ? err.message : err,
            "→ index.html 을 file:// 로 연 경우 브라우저가 막습니다. " +
              "webnovel 폴더에서 python -m http.server 후 http://localhost:8000/index.html 로 여세요."
          );
        });
    }

    function addCalendarDays(base, delta) {
      var d = new Date(base.getFullYear(), base.getMonth(), base.getDate() + delta);
      return d;
    }

    function updateTodayNavButtons() {
      var nextBtn = document.getElementById("today-next");
      if (nextBtn) {
        var atToday = todayViewOffsetDays >= 0;
        nextBtn.disabled = atToday;
        nextBtn.setAttribute("aria-disabled", atToday ? "true" : "false");
      }
    }

    function applyTodayCardImages() {
      if (todayViewOffsetDays > 0) todayViewOffsetDays = 0;
      var now = new Date();
      var viewDate = addCalendarDays(now, todayViewOffsetDays);
      var y = viewDate.getFullYear() % 100;
      var m = viewDate.getMonth() + 1;
      var d = viewDate.getDate();
      var yy = String(y).padStart(2, "0");
      var mm = String(m).padStart(2, "0");
      var dd = String(d).padStart(2, "0");
      var dateStr = yy + mm + dd;

      var isMonday = viewDate.getDay() === 1;
      var lastDay = new Date(viewDate.getFullYear(), m, 0).getDate();
      var isLastDayOfMonth = d === lastDay;

      var options = { year: "numeric", month: "long", day: "numeric", weekday: "long" };
      var labelEl = document.getElementById("today-label");
      if (labelEl) {
        var line = viewDate.toLocaleDateString("ko-KR", options);
        if (todayViewOffsetDays === -1) {
          line = "어제 · " + line;
        } else if (todayViewOffsetDays < -1) {
          line = Math.abs(todayViewOffsetDays) + "일 전 · " + line;
        }
        labelEl.textContent = line;
      }

      function setImg(id, filename) {
        var el = document.getElementById(id);
        if (!el) return;
        el.style.display = "";
        bindCardImage(el, filename, { eager: true });
      }

      function showBlock(id) {
        var el = document.getElementById(id);
        if (el) el.classList.remove("hidden");
      }

      function hideBlock(id) {
        var el = document.getElementById(id);
        if (el) el.classList.add("hidden");
      }

      if (isMonday) {
        hideBlock("block-daily");
        showBlock("block-weekly");
        setImg("weekly-img", "[W]" + dateStr + ".png");
      } else {
        showBlock("block-daily");
        hideBlock("block-weekly");
        setImg("daily-1", dateStr + "_1.png");
        setImg("daily-2", dateStr + "_2.png");
      }

      if (isLastDayOfMonth) {
        showBlock("block-monthly");
        setImg("monthly-img", "[M]" + dateStr + ".png");
      } else {
        hideBlock("block-monthly");
      }

      if (!isMonday) {
        if (!manifestIdOrUrlForFile(dateStr + "_1.png")) {
          console.warn(
            "[webnovel] drive-manifest.json 에 " +
              dateStr +
              "_1.png / _2.png 가 없습니다. Drive에 해당 이름으로 올린 뒤 python update_drive_manifest.py 를 다시 실행하세요."
          );
        }
      } else if (!manifestIdOrUrlForFile("[W]" + dateStr + ".png")) {
        console.warn(
          "[webnovel] drive-manifest.json 에 [W]" +
            dateStr +
            ".png 가 없습니다. Drive에 올린 뒤 python update_drive_manifest.py 를 다시 실행하세요."
        );
      }
      updateTodayNavButtons();
    }

    (function setupTodayNav() {
      var prevBtn = document.getElementById("today-prev");
      var nextBtn = document.getElementById("today-next");
      if (prevBtn) {
        prevBtn.addEventListener("click", function () {
          todayViewOffsetDays -= 1;
          applyTodayCardImages();
        });
      }
      if (nextBtn) {
        nextBtn.addEventListener("click", function () {
          if (todayViewOffsetDays < 0) {
            todayViewOffsetDays += 1;
            applyTodayCardImages();
          }
        });
      }
    })();

    applyTodayCardImages();
    loadCardImageIndex().then(function () {
      applyTodayCardImages();
    });

    (function () {
      var archiveData = [];
      var listEl = document.getElementById("archive-list");
      var emptyEl = document.getElementById("archive-empty");
      var searchEl = document.getElementById("archive-search");
      var typeEl = document.getElementById("archive-type");
      var viewerEl = document.getElementById("archive-viewer");
      var viewerInner = document.getElementById("archive-viewer-inner");
      var backBtn = document.getElementById("archive-back");
      var viewToday = document.getElementById("view-today");
      var viewArchive = document.getElementById("view-archive");
      var navBtns = document.querySelectorAll(".nav-btn");

      function escapeHtml(s) {
        if (s == null || s === "") return "";
        return String(s)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      function pad2(n) {
        return String(n).padStart(2, "0");
      }

      function parseKoreanDateToYYMMDD(s) {
        if (!s || !String(s).trim()) return null;
        var m = String(s).match(/(\d{2,4})\s*\.\s*(\d{1,2})\s*\.\s*(\d{1,2})/);
        if (!m) return null;
        var yRaw = m[1];
        var yy = yRaw.length >= 4 ? yRaw.slice(-2) : pad2(parseInt(yRaw, 10) % 100);
        var mm = pad2(parseInt(m[2], 10));
        var dd = pad2(parseInt(m[3], 10));
        return yy + mm + dd;
      }

      function lastDayYYMMDDInMonth(yymmdd) {
        if (!yymmdd || yymmdd.length !== 6) return yymmdd;
        var y = parseInt(yymmdd.slice(0, 2), 10);
        var mo = parseInt(yymmdd.slice(2, 4), 10);
        var yyyy = y + 2000;
        var last = new Date(yyyy, mo, 0);
        var y2 = last.getFullYear() % 100;
        return pad2(y2) + pad2(last.getMonth() + 1) + pad2(last.getDate());
      }

      function cellText(cells, i) {
        if (!cells || i >= cells.length) return "";
        return (cells[i].textContent || "").trim();
      }

      function findHashtagColumnIndex(trs) {
        if (!trs || trs.length < 2) return -1;
        var cells = trs[1].cells;
        var i;
        for (i = 0; i < cells.length; i++) {
          var t = (cells[i].textContent || "").trim();
          if (/해시\s*태그|해쉬\s*태그/i.test(t)) return i;
        }
        return -1;
      }

      /** 매일 구간(열 0~7) 헤더에서 "키워드" 열 인덱스 */
      function findDailyKeywordColumnIndex(trs) {
        if (!trs || trs.length < 2) return -1;
        var cells = trs[1].cells;
        var i;
        for (i = 0; i < cells.length; i++) {
          if (i > 7) break;
          var t = (cells[i].textContent || "").trim();
          if (/^키워드\s*$/.test(t)) return i;
        }
        return -1;
      }

      function findNthHeaderIndex(cells, regex, nth) {
        if (!cells) return -1;
        var hit = 0;
        var i;
        for (i = 0; i < cells.length; i++) {
          var t = (cells[i].textContent || "").trim();
          if (!regex.test(t)) continue;
          if (hit === nth) return i;
          hit++;
        }
        return -1;
      }

      function detectSheetColumns(trs) {
        var cells = trs && trs.length >= 2 ? trs[1].cells : null;
        var dailyTitle = findNthHeaderIndex(cells, /^제목$/, 0);
        var weeklyTitle = findNthHeaderIndex(cells, /^제목$/, 1);
        var monthlyTitle = findNthHeaderIndex(cells, /^제목$/, 2);
        var weeklyPlatform = findNthHeaderIndex(cells, /^플랫폼$/, 1);
        var monthlyPlatform = findNthHeaderIndex(cells, /^플랫폼$/, 2);
        var weeklyKeyword = findNthHeaderIndex(cells, /^키워드\s*$/, 1);
        var monthlyKeyword = findNthHeaderIndex(cells, /^키워드\s*$/, 2);
        var weeklyDate = findNthHeaderIndex(cells, /^날짜$/, 1);
        var monthlyDate = findNthHeaderIndex(cells, /^날짜$/, 2);
        if (monthlyDate < 0 && monthlyTitle >= 0) monthlyDate = monthlyTitle - 3;
        return {
          dailyDate: 0,
          dailyTitle: dailyTitle >= 0 ? dailyTitle : 2,
          dailyPlatform: 3,
          dailyGenre: 4,
          dailyKeyword: findDailyKeywordColumnIndex(trs),
          weeklyDate: weeklyDate >= 0 ? weeklyDate : 8,
          weeklyTitle: weeklyTitle >= 0 ? weeklyTitle : 11,
          weeklyPlatform: weeklyPlatform >= 0 ? weeklyPlatform : 12,
          weeklyKeyword: weeklyKeyword >= 0 ? weeklyKeyword : 13,
          weeklyExtraKeyword: weeklyKeyword >= 0 ? weeklyKeyword + 1 : 14,
          monthlyDate: monthlyDate >= 0 ? monthlyDate : 16,
          monthlyTitle: monthlyTitle >= 0 ? monthlyTitle : 19,
          monthlyPlatform: monthlyPlatform >= 0 ? monthlyPlatform : 20,
          monthlyKeyword: monthlyKeyword >= 0 ? monthlyKeyword : 21,
          monthlyExtraKeyword: monthlyKeyword >= 0 ? monthlyKeyword + 1 : 22
        };
      }

      function joinKeywordParts(parts) {
        var out = [];
        var j;
        for (j = 0; j < parts.length; j++) {
          var s = parts[j] && String(parts[j]).trim();
          if (s) out.push(s);
        }
        return out.join(" · ");
      }

      function normalizeItemKeywords(item) {
        if (!item) return;
        var kw = (item.keywords && String(item.keywords).trim()) || "";
        var ht = (item.hashtags && String(item.hashtags).trim()) || "";
        if (ht) {
          item.keywords = joinKeywordParts([kw, ht]);
          item.hashtags = "";
        }
      }

      function startOfTodayLocal() {
        var t = new Date();
        t.setHours(0, 0, 0, 0);
        return t.getTime();
      }

      function yymmddToMidnightTime(yymmdd) {
        if (!yymmdd || String(yymmdd).length !== 6) return null;
        var yy = parseInt(String(yymmdd).slice(0, 2), 10);
        var mo = parseInt(String(yymmdd).slice(2, 4), 10) - 1;
        var dd = parseInt(String(yymmdd).slice(4, 6), 10);
        var d = new Date(2000 + yy, mo, dd);
        d.setHours(0, 0, 0, 0);
        return d.getTime();
      }

      function isFutureArchiveDate(yymmdd) {
        var itemT = yymmddToMidnightTime(yymmdd);
        if (itemT == null) return false;
        return itemT > startOfTodayLocal();
      }

      /** 시트 매일 칸 자리 표시용 제목 — 아카이브에 넣지 않음 */
      function isPlaceholderDailyTitle(title) {
        var t = (title || "").trim();
        return t === "위클리" || t === "먼슬리";
      }

      function extractHashTagsFromText(s) {
        if (!s) return "";
        var m = String(s).match(/#[^\s#，,]+/g);
        return m ? m.join(" ") : "";
      }

      function parseSheet1ToArchive(doc) {
        var table = doc.querySelector("table.waffle");
        if (!table) return [];
        var tbody =
          table.tBodies && table.tBodies[0]
            ? table.tBodies[0]
            : table.querySelector("tbody");
        if (!tbody) return [];
        var trs = tbody.querySelectorAll("tr");
        var tagCol = findHashtagColumnIndex(trs);
        var cols = detectSheetColumns(trs);
        var items = [];
        var lastWeeklyYymmdd = null;
        var lastWeeklyPlatform = "";
        var lastWeeklyKeywords = "";
        var lastMonthlyDateStr = null;
        var lastMPlatform = "";
        var lastMKeywords = "";
        for (var ri = 3; ri < trs.length; ri++) {
          var cells = trs[ri].cells;
          if (!cells || cells.length < 12) continue;

          var rowTags = tagCol >= 0 ? cellText(cells, tagCol) : "";

          var dDate = parseKoreanDateToYYMMDD(cellText(cells, cols.dailyDate));
          var dTitle = cellText(cells, cols.dailyTitle);
          if (dDate && dTitle && !isPlaceholderDailyTitle(dTitle)) {
            var kwDailyBase =
              cols.dailyKeyword >= 0
                ? cellText(cells, cols.dailyKeyword)
                : [cellText(cells, 5), cellText(cells, 6)].filter(Boolean).join(" ");
            var kwDaily = joinKeywordParts([kwDailyBase, rowTags]);
            items.push({
              date: dDate,
              type: "daily",
              title: dTitle,
              platform: cellText(cells, cols.dailyPlatform),
              genre: cellText(cells, cols.dailyGenre),
              keywords: kwDaily,
              hashtags: ""
            });
          }

          var wDateCell = parseKoreanDateToYYMMDD(cellText(cells, cols.weeklyDate));
          if (wDateCell) lastWeeklyYymmdd = wDateCell;
          var wPlRaw = cellText(cells, cols.weeklyPlatform);
          if (wPlRaw) lastWeeklyPlatform = wPlRaw;
          var wKwRaw = cellText(cells, cols.weeklyKeyword);
          if (wKwRaw) lastWeeklyKeywords = wKwRaw;
          var wTitle = cellText(cells, cols.weeklyTitle);
          if (wTitle && lastWeeklyYymmdd) {
            var kwWBase = [wKwRaw || lastWeeklyKeywords, cellText(cells, cols.weeklyExtraKeyword)]
              .filter(Boolean)
              .join(" ");
            var kwW = joinKeywordParts([kwWBase, rowTags]);
            items.push({
              date: lastWeeklyYymmdd,
              type: "weekly",
              title: wTitle,
              platform: wPlRaw || lastWeeklyPlatform,
              genre: "",
              keywords: kwW,
              hashtags: ""
            });
          }

          var mDateFromHeader = parseKoreanDateToYYMMDD(cellText(cells, cols.monthlyDate));
          if (mDateFromHeader) {
            lastMonthlyDateStr = lastDayYYMMDDInMonth(mDateFromHeader);
            lastMPlatform = "";
            lastMKeywords = "";
          }
          var mPlRaw = cellText(cells, cols.monthlyPlatform);
          if (mPlRaw) lastMPlatform = mPlRaw;
          var mKwRaw = cellText(cells, cols.monthlyKeyword);
          if (mKwRaw) lastMKeywords = mKwRaw;
          var mTitle = cellText(cells, cols.monthlyTitle);
          if (mTitle) {
            var mDateStr = lastMonthlyDateStr;
            if (!mDateStr && dDate) mDateStr = lastDayYYMMDDInMonth(dDate);
            if (mDateStr) {
              var kwMBase = [mKwRaw || lastMKeywords, cellText(cells, cols.monthlyExtraKeyword)]
                .filter(Boolean)
                .join(" ");
              var kwM = joinKeywordParts([kwMBase, rowTags]);
              items.push({
                date: mDateStr,
                type: "monthly",
                title: mTitle,
                platform: mPlRaw || lastMPlatform,
                genre: "",
                keywords: kwM,
                hashtags: ""
              });
            }
          }
        }

        items.sort(function (a, b) {
          if (a.date !== b.date) return b.date.localeCompare(a.date);
          var order = { daily: 0, weekly: 1, monthly: 2 };
          return (order[a.type] || 0) - (order[b.type] || 0);
        });
        return items;
      }

      function formatDate(str) {
        if (!str || str.length !== 6) return str;
        var y = "20" + str.slice(0, 2);
        var m = str.slice(2, 4);
        var d = str.slice(4, 6);
        return y + "." + m + "." + d;
      }

      function typeLabel(type) {
        if (type === "daily") return "매일";
        if (type === "weekly") return "이번 주";
        if (type === "monthly") return "이번 달";
        return "";
      }

      /** 시트에서 매일 칸에만 적어두는 자리 표시용 제목 (아카이브에서 제외) */
      function archiveViewerFooterHtml() {
        return (
          '<div class="archive-viewer-footer">' +
          '<div class="site-footer-divider" aria-hidden="true"></div>' +
          '<div class="site-footer-links">' +
          '<a class="site-footer-link site-footer-link--kakao" href="https://open.kakao.com/o/g27r3fLg" target="_blank" rel="noopener noreferrer">' +
          '<span class="site-footer-link-icon" aria-hidden="true">' +
          '<svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none">' +
          '<rect width="24" height="24" rx="7" fill="#FEE500" />' +
          '<path fill="#191919" d="M6.75 11.25c0-.41.34-.75.75-.75h1.5c.41 0 .75.34.75.75v1.5c0 .41-.34.75-.75.75h-1.5a.75.75 0 0 1-.75-.75v-1.5zm4 0c0-.41.34-.75.75-.75h1.5c.41 0 .75.34.75.75v1.5c0 .41-.34.75-.75.75h-1.5a.75.75 0 0 1-.75-.75v-1.5zm4 0c0-.41.34-.75.75-.75h1.5c.41 0 .75.34.75.75v1.5c0 .41-.34.75-.75.75h-1.5a.75.75 0 0 1-.75-.75v-1.5z" />' +
          "</svg></span><span>오픈카톡 · 추천수다방</span></a>" +
          '<a class="site-footer-link site-footer-link--blog" href="https://blog.naver.com/ss_bookshelf" target="_blank" rel="noopener noreferrer">' +
          '<span class="site-footer-link-icon site-footer-link-icon--blog" aria-hidden="true">📝</span>' +
          "<span>네이버 블로그 · 독서리뷰</span></a></div>" +
          '<p class="site-footer-tagline">' +
          '<span class="site-footer-tagline-heart" aria-hidden="true">♡</span> 웹소설 웹툰 추천 <span class="site-footer-tagline-heart" aria-hidden="true">♡</span>' +
          "</p></div>"
        );
      }

      function archiveMetaLine(item) {
        var parts = [item.platform, item.genre].filter(function (s) {
          return s && String(s).trim();
        });
        return parts.join(" · ");
      }

      function archiveTagsLine(item) {
        return (item.keywords && String(item.keywords).trim()) || "";
      }

      function matchItem(item, query, typeFilter) {
        if (typeFilter && item.type !== typeFilter) return false;
        if (!query || !query.trim()) return true;
        var q = query.trim().toLowerCase();
        var legacyTags = item.hashtags || "";
        var hashTitle = extractHashTagsFromText(item.title || "");
        var hashKw = extractHashTagsFromText(item.keywords || "");
        var text = [
          item.title,
          item.platform,
          item.genre,
          item.keywords,
          legacyTags,
          hashTitle,
          hashKw
        ]
          .filter(Boolean)
          .join(" ");
        var keywords = (item.keywords || "").split(/[,，\s]+/).filter(Boolean);
        var tagTokens = String(legacyTags)
          .split(/[,，\s]+/)
          .filter(Boolean);
        var combined =
          (text + " " + keywords.join(" ") + " " + tagTokens.join(" ")).toLowerCase();
        var combinedNoHash = combined.replace(/#/g, "");
        var qNoHash = q.replace(/^#+/, "");
        return (
          combined.indexOf(q) !== -1 ||
          combinedNoHash.indexOf(q) !== -1 ||
          combined.indexOf(qNoHash) !== -1 ||
          combinedNoHash.indexOf(qNoHash) !== -1
        );
      }

      function renderList() {
        var query = searchEl ? searchEl.value : "";
        var typeFilter = typeEl ? typeEl.value : "";
        var filtered = archiveData.filter(function (item) {
          return matchItem(item, query, typeFilter);
        });

        if (!listEl) return;
        listEl.innerHTML = "";
        if (emptyEl) emptyEl.classList.add("hidden");

        if (filtered.length === 0) {
          if (emptyEl) emptyEl.classList.remove("hidden");
          return;
        }

        filtered.forEach(function (item) {
          var thumbFile =
            item.type === "daily"
              ? item.date + "_1.png"
              : item.type === "weekly"
                ? "[W]" + item.date + ".png"
                : "[M]" + item.date + ".png";
          var metaLine = archiveMetaLine(item);
          var tagsLine = archiveTagsLine(item);
          var tagsBlock = tagsLine
            ? "<span class=\"archive-item-tags\">" + escapeHtml(tagsLine) + "</span>"
            : "";
          var li = document.createElement("button");
          li.type = "button";
          li.className = "archive-item";
          li.dataset.date = item.date;
          li.dataset.type = item.type;
          li.innerHTML =
            "<span class=\"archive-item-thumb-wrap\"><img class=\"archive-item-thumb\" alt=\"\" src=\"" +
            PIXEL_GIF +
            "\" /></span>" +
            "<span class=\"archive-item-body\">" +
            "<span class=\"archive-item-type\">" +
            typeLabel(item.type) +
            "</span>" +
            "<span class=\"archive-item-date\">" +
            formatDate(item.date) +
            "</span>" +
            "<span class=\"archive-item-title\">" +
            escapeHtml(item.title || "-") +
            "</span>" +
            (metaLine
              ? "<span class=\"archive-item-meta\">" + escapeHtml(metaLine) + "</span>"
              : "") +
            tagsBlock +
            "</span>";
          bindCardImage(li.querySelector(".archive-item-thumb"), thumbFile);
          li.addEventListener("click", function () {
            openViewer(item.date, item.type);
          });
          listEl.appendChild(li);
        });
      }

      function openViewer(dateStr, type) {
        if (!viewerInner) return;
        var cardHtml = "";

        if (type === "daily") {
          cardHtml =
            "<div class=\"card-news card-news--today\">" +
            "<div class=\"card-pair card-pair--daily\">" +
            "<div class=\"card-img-wrap\"><img class=\"card-img\" alt=\"\" src=\"" +
            PIXEL_GIF +
            "\" data-card-file=\"" +
            dateStr +
            "_1.png\" /></div>" +
            "<div class=\"card-img-wrap\"><img class=\"card-img\" alt=\"\" src=\"" +
            PIXEL_GIF +
            "\" data-card-file=\"" +
            dateStr +
            "_2.png\" /></div>" +
            "</div></div>";
        } else if (type === "weekly") {
          cardHtml =
            "<div class=\"card-news card-news--week\">" +
            "<div class=\"card-img-wrap card-img-wrap--single\"><img class=\"card-img\" alt=\"\" src=\"" +
            PIXEL_GIF +
            "\" data-card-file=\"[W]" +
            dateStr +
            ".png\" /></div></div>";
        } else if (type === "monthly") {
          cardHtml =
            "<div class=\"card-news card-news--month\">" +
            "<div class=\"card-img-wrap card-img-wrap--single\"><img class=\"card-img\" alt=\"\" src=\"" +
            PIXEL_GIF +
            "\" data-card-file=\"[M]" +
            dateStr +
            ".png\" /></div></div>";
        }

        viewerInner.innerHTML =
          '<div class="archive-viewer-stack">' + cardHtml + archiveViewerFooterHtml() + "</div>";
        viewerInner.querySelectorAll("img.card-img[data-card-file]").forEach(function (im) {
          bindCardImage(im, im.getAttribute("data-card-file") || "", { eager: true });
        });
        if (viewerEl) viewerEl.classList.remove("hidden");
      }

      function closeViewer() {
        if (viewerEl) viewerEl.classList.add("hidden");
      }

      if (backBtn) backBtn.addEventListener("click", closeViewer);

      var searchDebounceId = null;
      if (searchEl) {
        searchEl.addEventListener("input", function () {
          if (searchDebounceId) clearTimeout(searchDebounceId);
          searchDebounceId = setTimeout(function () {
            searchDebounceId = null;
            renderList();
          }, 140);
        });
      }
      if (typeEl) typeEl.addEventListener("change", renderList);

      navBtns.forEach(function (btn) {
        btn.addEventListener("click", function () {
          var view = this.getAttribute("data-view");
          navBtns.forEach(function (b) {
            b.classList.remove("active");
            b.setAttribute("aria-pressed", "false");
          });
          this.classList.add("active");
          this.setAttribute("aria-pressed", "true");
          if (view === "today") {
            if (viewToday) viewToday.classList.remove("hidden");
            if (viewArchive) viewArchive.classList.add("hidden");
            if (viewerEl) viewerEl.classList.add("hidden");
          } else {
            if (viewToday) viewToday.classList.add("hidden");
            if (viewArchive) viewArchive.classList.remove("hidden");
          }
        });
      });

      function fetchTextTryUrls(urls) {
        var i = 0;
        function next() {
          if (i >= urls.length) return Promise.resolve(null);
          var u = urls[i++];
          return fetch(u, { cache: "no-store" })
            .then(function (res) {
              return res.ok ? res.text() : next();
            })
            .catch(function () {
              return next();
            });
        }
        return next();
      }

      function bootArchive() {
        var subKo = "웹소설_웹툰 추천 리스트";
        var pSheet = fetchTextTryUrls([
          "./sheet1.html",
          "./" + encodeURI(subKo + "/시트1.html")
        ]).then(function (text) {
          if (!text) {
            console.warn(
              "[webnovel] sheet1.html 을 불러오지 못했습니다. Live Server 루트가 webnovel 폴더인지, 같은 폴더에 sheet1.html 이 있는지 확인하세요."
            );
          }
          return text;
        });
        var pJson = fetch("./archive.json", { cache: "no-store" })
          .then(function (res) {
            return res.ok ? res.json() : Promise.reject();
          })
          .catch(function () {
            return null;
          });

        Promise.all([pSheet, pJson]).then(function (tuple) {
          var sheetText = tuple[0];
          var jsonData = tuple[1];
          var parser = new DOMParser();
          var items = [];

          if (jsonData && jsonData.items) {
            items = jsonData.items;
            if (items.length) {
              console.info(
                "[webnovel] 아카이브는 archive.json (" + items.length + "개) 에서 불러왔습니다."
              );
            }
          }
          if (!items.length && sheetText) {
            var sdoc = parser.parseFromString(sheetText, "text/html");
            items = parseSheet1ToArchive(sdoc);
            if (!items.length) {
              console.warn(
                "[webnovel] 시트 HTML은 받았지만 파싱된 아카이브가 0개입니다. 시트보내기 형식이 바뀌었을 수 있습니다."
              );
            }
          }
          if (!items.length) {
            console.warn(
              "[webnovel] 아카이브가 비었습니다. 터미널에서 python build_archive_json.py 를 실행해 archive.json 을 만드세요."
            );
          }

          archiveData = items
            .filter(function (item) {
              if (isFutureArchiveDate(item.date)) return false;
              if (item.type === "daily" && isPlaceholderDailyTitle(item.title)) return false;
              return true;
            })
            .map(function (item) {
              normalizeItemKeywords(item);
              return item;
            });
          renderList();
        });
      }

      bootArchive();
    })();
  </script>
